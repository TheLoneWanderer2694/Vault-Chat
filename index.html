<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Transparent Twitch Chat</title>
    <style>
        /* --- CUSTOMIZE YOUR CHAT STYLING HERE --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #chat-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }

        .chat-message {
            background: rgba(0, 0, 0, 0.65); /* Semi-transparent message bubble */
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 18px;
            line-height: 1.4;
            word-break: break-word;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.25s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .username {
            font-weight: bold;
            color: #a970ff; /* Twitch light purple accent color */
            margin-right: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <script>
        // Pulls channel name from URL query parameter (e.g. ?channel=myname)
        const urlParams = new URLSearchParams(window.location.search);
        const channel = urlParams.get('channel') || 'monstercat'; // Fallback if none provided

        const chatContainer = document.getElementById('chat-container');
        const maxMessages = 30; // Keeps DOM light by clearing old messages

        function connect() {
            // Connect anonymously to Twitch IRC WebSocket
            const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            ws.onopen = () => {
                ws.send('PASS SCHMOOPIIE');
                ws.send('NICK justinfan' + Math.floor(Math.random() * 89999 + 10000));
                ws.send('JOIN #' + channel.toLowerCase());
            };

            ws.onmessage = (event) => {
                const message = event.data;
                
                // Respond to Twitch PING to keep connection alive
                if (message.startsWith('PING')) {
                    ws.send('PONG ' + message.split(' ')[1]);
                    return;
                }

                // Parse standard chat messages (PRIVMSG)
                if (message.includes('PRIVMSG')) {
                    try {
                        const parsedUser = message.match(/:([^!]+)!/)[1];
                        const parsedMessage = message.split('PRIVMSG')[1].split(':').slice(1).join(':').trim();
                        
                        appendMessage(parsedUser, parsedMessage);
                    } catch (e) {
                        console.error('Error parsing chat message', e);
                    }
                }
            };

            ws.onclose = () => {
                // Auto-reconnect if connection drops
                setTimeout(connect, 5000);
            };
        }

        function appendMessage(user, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-message';
            
            const userSpan = document.createElement('span');
            userSpan.className = 'username';
            userSpan.textContent = user + ':';
            
            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            
            msgDiv.appendChild(userSpan);
            msgDiv.appendChild(textSpan);
            
            chatContainer.appendChild(msgDiv);

            // Prune old messages to prevent overflowing the layout
            while (chatContainer.children.length > maxMessages) {
                chatContainer.removeChild(chatContainer.firstChild);
            }
        }

        connect();
    </script>
</body>
</html>
