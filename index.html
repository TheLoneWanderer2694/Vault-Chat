<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents the favicon 404 error -->
    <link rel="icon" href="data:,">
    <title>Custom Transparent Twitch Chat</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #chat-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }

        .chat-message {
            background: rgba(0, 0, 0, 0.65);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 18px;
            line-height: 1.4;
            word-break: break-word;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        .chat-message.fade-out {
            opacity: 0;
        }

        .username {
            font-weight: bold;
            color: #a970ff;
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const channel = urlParams.get('channel') || 'monstercat';

        const chatContainer = document.getElementById('chat-container');
        const messageDisplayTime = 15000; // Time in ms before fading out (15 seconds)

        function connect() {
            const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            ws.onopen = () => {
                ws.send('PASS SCHMOOPIIE');
                ws.send('NICK justinfan' + Math.floor(Math.random() * 89999 + 10000));
                ws.send('JOIN #' + channel.toLowerCase());
            };

            ws.onmessage = (event) => {
                const message = event.data;
                
                if (message.startsWith('PING')) {
                    ws.send('PONG ' + message.split(' ')[1]);
                    return;
                }

                if (message.includes('PRIVMSG')) {
                    try {
                        const parsedUser = message.match(/:([^!]+)!/)[1];
                        const parsedMessage = message.split('PRIVMSG')[1].split(':').slice(1).join(':').trim();
                        
                        appendMessage(parsedUser, parsedMessage);
                    } catch (e) {
                        console.error('Error parsing chat message', e);
                    }
                }
            };

            ws.onclose = () => {
                setTimeout(connect, 5000);
            };
        }

        function appendMessage(user, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-message';
            
            const userSpan = document.createElement('span');
            userSpan.className = 'username';
            userSpan.textContent = user + ':';
            
            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            
            msgDiv.appendChild(userSpan);
            msgDiv.appendChild(textSpan);
            
            chatContainer.appendChild(msgDiv);

            setTimeout(() => {
                msgDiv.classList.add('fade-out');
                setTimeout(() => {
                    if (msgDiv.parentElement) {
                        msgDiv.remove();
                    }
                }, 1000);
            }, messageDisplayTime);
        }

        connect();
    </script>
</body>
</html>
